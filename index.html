<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Mine Aviator - Mobile Ready</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 10px;
            background: radial-gradient(circle at center, #1f1207 0%, #080402 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px; /* მობილურისთვის ოპტიმალური სიგანე */
            height: 520px;
            background: linear-gradient(135deg, #140c06, #050301);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(255, 215, 0, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            border: 2px solid #5a401b;
        }

        .top-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 6, 3, 0.95);
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid #c59b27;
            z-index: 10;
            width: 100%;
        }
        .hud-box {
            font-size: 14px;
            font-weight: bold;
            color: #ffd700;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .hud-box span {
            color: #fff;
            font-size: 15px;
        }

        .center-screen {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .cart-icon {
            font-size: 55px;
            margin-bottom: 5px;
            transition: transform 0.1s ease;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.8));
        }

        .multiplier-display {
            font-size: 65px;
            font-weight: 900;
            color: #00ffaa;
            text-shadow: 0 0 25px rgba(0, 255, 170, 0.8), 0 4px 10px rgba(0,0,0,0.9);
        }

        .status-text {
            font-size: 14px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            margin-top: 5px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 12px;
            border-radius: 6px;
            text-align: center;
        }

        .control-panel {
            background: rgba(0, 0, 0, 0.85);
            padding: 12px 15px;
            border-radius: 15px;
            border: 1px solid #5a401b;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .bet-input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .bet-input-group label {
            font-size: 11px;
            color: #aaa;
        }

        .bet-controls-wrapper {
            display: flex;
            align-items: center;
            background: #111;
            border: 1px solid #c59b27;
            border-radius: 8px;
            overflow: hidden;
        }

        .bet-btn {
            background: #222;
            border: none;
            color: #ffd700;
            font-size: 16px;
            font-weight: bold;
            padding: 8px 12px;
            cursor: pointer;
        }
        .bet-btn:active {
            background: #444;
        }

        .bet-input-group input {
            background: transparent;
            border: none;
            color: #fff;
            padding: 8px 0;
            font-size: 16px;
            width: 50px;
            text-align: center;
            font-weight: bold;
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: 0.2s;
        }

        .btn-start {
            background: linear-gradient(135deg, #ffd700, #ff9900);
            color: #0b0704;
        }
        .btn-cashout {
            background: linear-gradient(135deg, #00ffaa, #00aa66);
            color: #0b0704;
            display: none;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-2px, 0px) rotate(-1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-1px, 2px) rotate(0deg); }
            80% { transform: translate(2px, 1px) rotate(-1deg); }
            100% { transform: translate(1px, -2px) rotate(1deg); }
        }
        .shaking {
            animation: shake 0.3s infinite;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="top-panel">
        <div class="hud-box">ბალანსი: <span id="balance">1000.00</span> ₾</div>
        <div class="hud-box" style="color: #00ffaa;">მოგება: <span id="potential-win">0.00</span> ₾</div>
    </div>

    <div class="center-screen">
        <div class="cart-icon" id="cart">🛒⛏️</div>
        <div class="multiplier-display" id="multiplier">1.00x</div>
        <div class="status-text" id="status-msg">მზად არის თამაშისთვის!</div>
    </div>

    <div class="control-panel">
        <div class="control-row">
            <div class="bet-input-group">
                <label>ფსონი (1 - 50 ₾)</label>
                <div class="bet-controls-wrapper">
                    <button class="bet-btn" onclick="changeBet(-1)">-</button>
                    <input type="number" id="bet-amount" value="10" min="1" max="50">
                    <button class="bet-btn" onclick="changeBet(1)">+</button>
                </div>
            </div>
        </div>
        
        <button class="action-btn btn-start" id="start-btn" onclick="startGame()">გაშვება</button>
        <button class="action-btn btn-cashout" id="cashout-btn" onclick="cashOut()">მოხსნა (Cash Out)</button>
    </div>
</div>

<script>
    let balance = 1000;
    let currentBet = 10;
    let multiplier = 1.00;
    let gameInterval = null;
    let isPlaying = false;
    let crashPoint = 1.00;

    const balanceEl = document.getElementById('balance');
    const potentialWinEl = document.getElementById('potential-win');
    const multiplierEl = document.getElementById('multiplier');
    const statusMsgEl = document.getElementById('status-msg');
    const startBtn = document.getElementById('start-btn');
    const cashoutBtn = document.getElementById('cashout-btn');
    const cartEl = document.getElementById('cart');
    const betInput = document.getElementById('bet-amount');

    function changeBet(amount) {
        if (isPlaying) return;
        let val = parseInt(betInput.value) || 1;
        val += amount;
        if (val < 1) val = 1;
        if (val > 50) val = 50;
        betInput.value = val;
    }

    function startGame() {
        currentBet = parseFloat(betInput.value);
        
        if (isNaN(currentBet) || currentBet < 1 || currentBet > 50) {
            alert("ფსონი უნდა იყოს 1-დან 50 ლარამდე!");
            return;
        }
        if (currentBet > balance) {
            alert("არასაკმარისი ბალანსი!");
            return;
        }

        balance -= currentBet;
        balanceEl.innerText = balance.toFixed(2);

        isPlaying = true;
        multiplier = 1.00;
        multiplierEl.innerText = "1.00x";
        multiplierEl.style.color = "#00ffaa";
        potentialWinEl.innerText = (currentBet * multiplier).toFixed(2);
        statusMsgEl.innerText = "ვაგონი მიქრის შახტში... მოასწარი მოხსნა!";
        
        startBtn.style.display = 'none';
        cashoutBtn.style.display = 'block';
        betInput.disabled = true;
        cartEl.classList.add('shaking');
        cartEl.innerText = "🛒💎";

        let randomValue = Math.random();
        if (randomValue < 0.08) {
            crashPoint = 1.00 + (Math.random() * 0.12);
        } else {
            crashPoint = 1.15 + (Math.pow(Math.random(), 2) * 12.0); 
        }

        let speed = 40;

        gameInterval = setInterval(() => {
            let growthRate = 0.003 + (multiplier * 0.008);
            multiplier += growthRate;
            
            multiplierEl.innerText = multiplier.toFixed(2) + "x";
            potentialWinEl.innerText = (currentBet * multiplier).toFixed(2);

            if (multiplier >= crashPoint)	{
                endGame();
            }
        }, speed);
    }

    function cashOut() {
        if (!isPlaying) return;
        clearInterval(gameInterval);
        isPlaying = false;

        let winAmount = currentBet * multiplier;
        balance += winAmount;
        balanceEl.innerText = balance.toFixed(2);

        multiplierEl.style.color = "#ffd700";
        statusMsgEl.innerText = `🎉 წარმატებით მოხსენი! მოიგე ${winAmount.toFixed(2)} ₾!`;
        cartEl.classList.remove('shaking');
        cartEl.innerText = "💰✨";

        startBtn.style.display = 'block';
        cashoutBtn.style.display = 'none';
        betInput.disabled = false;
    }

    function endGame() {
        clearInterval(gameInterval);
        isPlaying = false;

        multiplierEl.style.color = "#ff4444";
        statusMsgEl.innerText = "💥 შახტი ჩამოინგრა! ფსონი დაიკარგა!";
        potentialWinEl.innerText = "0.00";
        cartEl.classList.remove('shaking');
        cartEl.innerText = "💥⛏️";

        startBtn.style.display = 'block';
        cashoutBtn.style.display = 'none';
        betInput.disabled = false;
    }
</script>

</body>
</html>
